name: Azhand Release Pipeline

on:
  repository_dispatch:
    types: [azhand_zip_release]

permissions:
  contents: write

concurrency:
  group: azhand-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate payload
        shell: bash
        env:
          VERSION: ${{ github.event.client_payload.release.version }}
          DOWNLOAD_URL: ${{ github.event.client_payload.release.download_url }}
          DEPLOY_URL: ${{ github.event.client_payload.release.deploy_url }}
          UPDATE_URL: ${{ github.event.client_payload.release.update_url }}
          API_BASE_URL: ${{ github.event.client_payload.release.api_base_url }}
          EXPECTED_SHA256: ${{ github.event.client_payload.release.sha256 }}
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$DOWNLOAD_URL"
          jq -e '.client_payload.release.download_token | strings | length > 0' "$GITHUB_EVENT_PATH" >/dev/null
          test -n "$DEPLOY_URL"
          jq -e '.client_payload.release.deploy_token | strings | length > 0' "$GITHUB_EVENT_PATH" >/dev/null
          test -n "$UPDATE_URL"
          jq -e '.client_payload.release.update_token | strings | length > 0' "$GITHUB_EVENT_PATH" >/dev/null
          jq -e '.client_payload.release.signing_token | strings | length > 0' "$GITHUB_EVENT_PATH" >/dev/null
          jq -e '.client_payload.release.signing_url | strings | length > 0' "$GITHUB_EVENT_PATH" >/dev/null
          test -n "$API_BASE_URL"
          test -n "$EXPECTED_SHA256"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download release ZIP
        shell: bash
        env:
          DOWNLOAD_URL: ${{ github.event.client_payload.release.download_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $DOWNLOAD_TOKEN" \
            "$DOWNLOAD_URL" \
            -o /tmp/azhand-release.zip

      - name: Verify SHA-256
        shell: bash
        env:
          EXPECTED_SHA256: ${{ github.event.client_payload.release.sha256 }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_SHA256  /tmp/azhand-release.zip" | sha256sum --check

      - name: Validate archive
        shell: python
        run: |
          import stat
          import zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile("/tmp/azhand-release.zip") as zf:
              infos = zf.infolist()
              if not infos:
                  raise SystemExit("ZIP is empty")
              if len(infos) > 10000:
                  raise SystemExit("Too many files")

              total = 0
              for info in infos:
                  total += info.file_size
                  if total > 300 * 1024 * 1024:
                      raise SystemExit("Expanded ZIP too large")

                  # ZIP member paths should be POSIX-style. Reject backslashes
                  # explicitly instead of normalizing them, which also avoids
                  # any cross-language escaping ambiguity.
                  name = info.filename
                  if chr(92) in name:
                      raise SystemExit(f"Backslash path not allowed: {name}")

                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe path: {name}")

                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {name}")

      - name: Extract release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/azhand-extracted
          mkdir -p /tmp/azhand-extracted
          unzip -q /tmp/azhand-release.zip -d /tmp/azhand-extracted

      - name: Resolve project root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          entries=(/tmp/azhand-extracted/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            src="${entries[0]}"
          else
            src="/tmp/azhand-extracted"
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"

      - name: Sync project to main
        shell: bash
        env:
          SRC: ${{ steps.root.outputs.src }}
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/**' \
            "$SRC"/ ./

      - name: Commit and push source
        shell: bash
        env:
          VERSION: ${{ github.event.client_payload.release.version }}
        run: |
          set -euo pipefail
          git config user.name "Azhand Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "chore(release): import Azhand v$VERSION"
            git push origin HEAD:main
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare permanent Android signing identity
        shell: bash
        run: |
          set -euo pipefail

          SIGNING_URL="$(jq -r '.client_payload.release.signing_url' "$GITHUB_EVENT_PATH")"
          SIGNING_TOKEN="$(jq -r '.client_payload.release.signing_token' "$GITHUB_EVENT_PATH")"

          test -n "$SIGNING_URL"
          test -n "$SIGNING_TOKEN"
          test "$SIGNING_URL" != "null"
          test "$SIGNING_TOKEN" != "null"

          http_code="$(
            curl --silent --show-error \
              -o /tmp/azhand-signing.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $SIGNING_TOKEN" \
              "$SIGNING_URL"
          )"

          if [ "$http_code" = "200" ]; then
            python3 - <<'PY'
          import base64, json, os
          from pathlib import Path

          data = json.loads(Path("/tmp/azhand-signing.json").read_text())
          Path("app/azhand-release.jks").write_bytes(
              base64.b64decode(data["jks_base64"], validate=True)
          )

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as f:
              f.write("ANDROID_KEYSTORE_PATH=azhand-release.jks\n")
              f.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              f.write(f"ANDROID_KEY_ALIAS={data['alias']}\n")
              f.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

            store_pass="$(jq -r '.store_password' /tmp/azhand-signing.json)"
            key_pass="$(jq -r '.key_password' /tmp/azhand-signing.json)"
            echo "::add-mask::$store_pass"
            echo "::add-mask::$key_pass"
            echo "Permanent Android signing identity restored from Cloudflare KV."
          elif [ "$http_code" = "404" ]; then
            alias="azhand"
            store_pass="$(openssl rand -hex 24)"
            key_pass="$(openssl rand -hex 24)"

            echo "::add-mask::$store_pass"
            echo "::add-mask::$key_pass"

            keytool -genkeypair \
              -keystore app/azhand-release.jks \
              -storetype JKS \
              -storepass "$store_pass" \
              -keypass "$key_pass" \
              -alias "$alias" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname "CN=Azhand, OU=Mobile, O=Azhand"

            STORE_PASS="$store_pass" KEY_PASS="$key_pass" ALIAS="$alias" \
            python3 - <<'PY'
          import base64, json, os
          from pathlib import Path

          payload = {
              "alias": os.environ["ALIAS"],
              "store_password": os.environ["STORE_PASS"],
              "key_password": os.environ["KEY_PASS"],
              "jks_base64": base64.b64encode(
                  Path("app/azhand-release.jks").read_bytes()
              ).decode("ascii")
          }
          Path("/tmp/azhand-signing-upload.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )
          PY

            curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $SIGNING_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/azhand-signing-upload.json \
              "$SIGNING_URL"

            {
              echo "ANDROID_KEYSTORE_PATH=azhand-release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$store_pass"
              echo "ANDROID_KEY_ALIAS=$alias"
              echo "ANDROID_KEY_PASSWORD=$key_pass"
            } >> "$GITHUB_ENV"

            echo "Permanent Android signing identity created and stored in Cloudflare KV."
          else
            echo "Signing service HTTP $http_code"
            exit 1
          fi

      - name: Build Android
        shell: bash
        env:
          AZHAND_API_BASE_URL: ${{ github.event.client_payload.release.api_base_url }}
        run: |
          set -euo pipefail
          if [ -x scripts/build-android.sh ]; then
            scripts/build-android.sh
          elif [ -f settings.gradle.kts ] && [ -d app ]; then
            gradle :app:assembleDebug --stacktrace
          else
            echo "Android project not found."
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azhand-v${{ github.event.client_payload.release.version }}-android
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish signed Android update to Cloudflare KV
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        shell: bash
        env:
          VERSION: ${{ github.event.client_payload.release.version }}
          UPDATE_URL: ${{ github.event.client_payload.release.update_url }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$apk"

          version_code="$(
            grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts               | head -n 1               | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/'
          )"
          test -n "$version_code"

          curl --fail --silent --show-error             -X PUT             -H "Authorization: Bearer $UPDATE_TOKEN"             -H "Content-Type: application/vnd.android.package-archive"             -H "X-Azhand-Version: $VERSION"             -H "X-Azhand-Version-Code: $version_code"             --data-binary "@$apk"             "$UPDATE_URL"

      - name: Locate Worker source
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          file=""
          for candidate in worker.js worker/worker.js backend/worker.js apps/worker/worker.js; do
            if [ -f "$candidate" ]; then
              file="$candidate"
              break
            fi
          done

          if [ -z "$file" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.worker.outputs.found == 'true'
        shell: bash
        env:
          VERSION: ${{ github.event.client_payload.release.version }}
          DEPLOY_URL: ${{ github.event.client_payload.release.deploy_url }}
          WORKER_FILE: ${{ steps.worker.outputs.file }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/javascript+module" \
            -H "X-Azhand-Version: $VERSION" \
            --data-binary "@$WORKER_FILE" \
            "$DEPLOY_URL"

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ github.event.client_payload.release.version }}
        run: |
          {
            echo "## ✅ Azhand v$VERSION"
            echo ""
            echo "- Source synced to main"
            echo "- SHA-256 verified"
            echo "- Android APK built"
            echo "- Android artifact uploaded"
            echo "- Permanent Android signing identity handled automatically"
            echo "- Signed release published to Cloudflare KV"
            echo "- Cloudflare Worker deployed"
          } >> "$GITHUB_STEP_SUMMARY"
